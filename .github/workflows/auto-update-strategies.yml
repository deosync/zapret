name: Auto Update Flowseal Strategies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-strategies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-strategies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream https://github.com/Flowseal/zapret-discord-youtube.git || true
          git fetch upstream --depth=1

      - name: Get upstream commit & check
        id: check
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          if [ -f .last_upstream_commit ]; then
            LAST_COMMIT=$(cat .last_upstream_commit)
          else
            LAST_COMMIT=""
          fi
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_COMMIT" != "$LAST_COMMIT" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✅ Upstream changed: $UPSTREAM_COMMIT"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes in upstream"
          fi

      - name: Download upstream .bat files
        if: steps.check.outputs.has_updates == 'true'
        run: |
          rm -rf temp_upstream upstream_bats || true
          git clone --depth 1 https://github.com/Flowseal/zapret-discord-youtube.git temp_upstream
          mkdir -p upstream_bats
          find temp_upstream -type f -iname "*.bat" -print0 | xargs -0 -I{} cp {} upstream_bats/ || true
          rm -rf temp_upstream
          echo "✅ .bat files gathered"

      - name: Convert .bat -> flowseal-altN.sh (place in module/strategy)
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -e
          mkdir -p module/strategy
          rm -f module/strategy/flowseal-alt*.sh || true

          cat > convert_bats_to_strategy.py <<'PY'
#!/usr/bin/env python3
import re
import os
from pathlib import Path

def clean_and_join_lines(text):
    out=[]
    for l in text.splitlines():
        s = l.strip()
        if not s:
            continue
        if s.startswith('::') or s.startswith('@echo') or s.startswith('chcp') or s.startswith('cd ') or s.startswith('call ') or s.startswith('set ') or s.startswith('start '):
            continue
        s = s.rstrip('^').strip()
        out.append(s)
    return ' '.join(out)

def normalize_rule(rule):
    rule = re.sub(r'\s+', ' ', rule)
    rule = re.sub(r'--([a-z\-]+)\s+', r'--\1=', rule)
    rule = rule.replace('"', '')
    rule = rule.replace('\\', '/')
    rule = re.sub(r'%BIN%|"[^"]*\\bin\\', '$MODPATH/fake/', rule)
    rule = re.sub(r'%LISTS%|"[^"]*\\lists\\', '$MODPATH/list/', rule)
    rule = re.sub(r'%GameFilter%', '', rule)
    rule = re.sub(r'"[^"]*winws\.exe"\s*', '', rule)
    rule = re.sub(r'--wf-tcp[=\s]+[0-9,\-]+\s*', '', rule)
    rule = re.sub(r'--wf-udp[=\s]+[0-9,\-]+\s*', '', rule)
    return rule.strip()

def main():
    src = Path('upstream_bats')
    out_dir = Path('module/strategy')
    out_dir.mkdir(parents=True, exist_ok=True)
    seq = 1
    total = 0
    for bat in sorted(src.glob('*.bat')):
        try:
            text = bat.read_text(encoding='utf-8', errors='ignore')
            full = clean_and_join_lines(text)
            parts = [p.strip() for p in full.split('--new') if p.strip()]
            for p in parts:
                norm = normalize_rule(p)
                if not norm:
                    continue
                fname = out_dir / f'flowseal-alt{seq}.sh'
                header = f"""#!/bin/bash
# Auto-generated strategy: flowseal-alt{seq}
# Source BAT: {bat.name}
# Generated by auto-update-strategies workflow
"""
                body = f'config="{norm} --new"\n'
                fname.write_text(header + "\n" + body, encoding='utf-8')
                os.chmod(fname, 0o755)
                seq += 1
                total += 1
        except Exception as e:
            print(f"Error processing {bat}: {e}")
    print(f"Converted total: {total} files")

if __name__ == '__main__':
    main()
PY

          python3 convert_bats_to_strategy.py
          echo "✅ Conversion done. Files placed in module/strategy/"

      - name: Show converted files (summary)
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "Converted files:"
          ls -1 module/strategy/flowseal-alt*.sh || echo "(no strategy files found)"

      - name: Commit & push changes to repository
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set -e
          git config user.name "github-actions[auto-convert]"
          git config user.email "actions@github.com"
          echo "${{ steps.check.outputs.upstream_commit }}" > .last_upstream_commit
          git add module/strategy/ .last_upstream_commit || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          COMMIT_MSG="Auto-convert: Update strategies from upstream ${{ steps.check.outputs.upstream_commit }} [auto-convert]"
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:main --follow-tags

      - name: Trigger build/release workflow (build_module.yml) via workflow_dispatch
        if: steps.check.outputs.has_updates == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "PAT_TOKEN not provided — skipping workflow_dispatch trigger."
            exit 0
          fi
          WORKFLOW_ID="build_module.yml"
          REPO="${{ github.repository }}"
          REF="main"
          echo "Triggering workflow_dispatch for ${WORKFLOW_ID} on ${REPO} (ref=${REF})"
          RESPONSE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches \
            -d "{\"ref\":\"${REF}\"}")
          if [ "$RESPONSE" -eq 204 ] || [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 202 ]; then
            echo "✅ workflow_dispatch triggered (HTTP $RESPONSE)"
          else
            echo "⚠️ workflow_dispatch may have failed (HTTP $RESPONSE). Check permissions or workflow file name."
            exit 1
          fi

      - name: Add summary to job
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "## ✅ Strategies updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Upstream commit:** \`${{ steps.check.outputs.upstream_commit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files:**" >> $GITHUB_STEP_SUMMARY
          ls -1 module/strategy/flowseal-alt*.sh | sed -e 's|module/strategy/||g' | while read f; do echo "- $f" >> $GITHUB_STEP_SUMMARY; done
